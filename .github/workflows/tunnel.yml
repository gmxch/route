name: deploy-solver

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'SERVICE / folder di dalam repo target'
        required: true
      host:
        description: 'Subdomain (mis. tes-aa → tes-aa.lhr.life)'
        required: true
      port:
        description: 'PORT app'
        required: false
        default: '7860'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: gmxch/solver
          path: target

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb git curl wget ca-certificates openssh-client \
            python3 python3-venv python3-pip \
            nodejs npm

      - name: Install Chromium
        run: |
          sudo apt-get install -y -qq chromium-browser || \
          sudo apt-get install -y -qq chromium || true
          FOUND=""
          for c in /usr/bin/chromium-browser /usr/bin/chromium /usr/bin/google-chrome; do
            [ -x "$c" ] && FOUND="$c" && break
          done
          [ -n "$FOUND" ] && sudo ln -sf "$FOUND" /usr/bin/google-chrome-stable
          /usr/bin/google-chrome-stable --version || true

      - name: Setup app
        env:
          PORT: ${{ inputs.port }}
        working-directory: target/${{ inputs.folder }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/runner.sh"
          bash "$GITHUB_WORKSPACE/runner.sh" > /tmp/app.log 2>&1 &
          echo "app pid=$!"

      - name: Wait for port
        run: |
          PORT="${{ inputs.port }}"
          for i in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:${PORT}" >/dev/null 2>&1 && {
              echo "port ${PORT} up (${i}x2s)"; exit 0; }
            sleep 2
          done
          echo "app tidak listen, dump log:"; tail -n 200 /tmp/app.log || true; exit 1

      - name: Start SSH Tunnel (localhost.run)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 localhost.run >> ~/.ssh/known_hosts 2>/dev/null

          nohup ssh -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=~/.ssh/known_hosts \
                    -o ServerAliveInterval=30 \
                    -o ServerAliveCountMax=3 \
                    -o ExitOnForwardFailure=yes \
                    -R "${{ inputs.host }}:80:localhost:${{ inputs.port }}" \
                    nokey@localhost.run > /tmp/tunnel.log 2>&1 &
          echo "ssh pid=$!"

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.lhr\.(life|rocks)' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "gagal dapat URL, dump log:"; tail -n 60 /tmp/tunnel.log; exit 1
          fi
          echo "URL=$URL" >> $GITHUB_ENV
          echo "::notice title=Tunnel URL::$URL"

      - name: Summary
        run: |
          {
            echo "## Solver Running"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **URL** | [$URL]($URL) |"
            echo "| **Folder** | \`${{ inputs.folder }}\` |"
            echo "| **Port** | \`${{ inputs.port }}\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Keep alive
        run: |
          while true; do
            sleep 60
            if ! pgrep -f "ssh.*localhost.run" >/dev/null; then
              echo "ssh tunnel mati:"; tail -n 30 /tmp/tunnel.log
            fi
          done