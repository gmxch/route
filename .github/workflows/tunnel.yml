name: tunnel

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'SERVICE'
        required: true
      category:
        description: 'Kategori'
        required: true
        default: 'cloudflare'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: gmxch/solver
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target

      - name: Generate random port
        run: echo "PORT=$((10000 + RANDOM % 55000))" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb git curl wget ca-certificates \
            python3 python3-venv python3-pip \
            nodejs npm chromium

      - name: Setup app
        env:
          PORT: ${{ env.PORT }}
        working-directory: target/${{ inputs.folder }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/runner.sh"
          bash "$GITHUB_WORKSPACE/runner.sh" > /tmp/app.log 2>&1 &

      - name: Wait for port
        run: |
          for i in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:${{ env.PORT }}" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "app tidak listen, dump log:"; tail -n 200 /tmp/app.log || true; exit 1

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:${{ env.PORT }} > /tmp/tunnel.log 2>&1 &

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "gagal dapat URL, dump log:"; cat /tmp/tunnel.log; exit 1
          fi
          echo "URL=$URL" >> $GITHUB_ENV
          echo "::notice title=Tunnel URL::$URL"

      - name: Register Node to Bridge
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_ADMIN_KEY: ${{ secrets.BRIDGE_ADMIN_KEY }}
          NODE_CATEGORY: ${{ inputs.category }}
        run: |
          if [ -z "$BRIDGE_URL" ] || [ -z "$BRIDGE_ADMIN_KEY" ]; then
            exit 0
          fi
          
          NODE_ID=$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 6)
          NODE_KEY=$(head /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10)
          
          RESPONSE=$(curl -s -X POST "$BRIDGE_URL/v4/node" \
            -H "Content-Type: application/json" \
            -H "key: $BRIDGE_ADMIN_KEY" \
            -d "{
              \"action\": \"add\",
              \"category\": \"$NODE_CATEGORY\",
              \"id\": \"$NODE_ID\",
              \"url\": \"$URL\",
              \"key\": \"$NODE_KEY\"
            }")
            
          if ! echo "$RESPONSE" | grep -q '"status":"success"'; then
            echo "::warning::Registrasi node gagal. Respon: $RESPONSE"
          fi
          
          echo "NODE_ID=$NODE_ID" >> $GITHUB_ENV
          echo "NODE_KEY=$NODE_KEY" >> $GITHUB_ENV

      - name: Keep alive
        run: |
          while true; do
            sleep 60
            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "cloudflared tunnel mati:"; tail -n 30 /tmp/tunnel.log
              exit 1
            fi
          done