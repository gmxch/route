name: tunnel

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'SERVICE'
        required: true
      category:
        description: 'Kategori'
        required: true
        default: 'cloudflare'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: gmxch/solver
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target

      - name: Generate random port
        run: echo "PORT=$((10000 + RANDOM % 55000))" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb git curl wget ca-certificates \
            python3 python3-venv python3-pip \
            nodejs npm chromium

      - name: Setup app
        env:
          PORT: ${{ env.PORT }}
        working-directory: target/${{ inputs.folder }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/runner.sh"
          bash "$GITHUB_WORKSPACE/runner.sh" > /tmp/app.log 2>&1 &

      - name: Wait for port
        run: |
          for i in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:${{ env.PORT }}" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::App tidak listen"; tail -n 50 /tmp/app.log; exit 1

      - name: Install cloudflared
        run: |
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:${{ env.PORT }} > /tmp/tunnel.log 2>&1 &

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 | tr -d '\r\n ' || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::Gagal mendapatkan URL tunnel"
            cat /tmp/tunnel.log
            exit 1
          fi
          echo "URL=$URL" >> $GITHUB_ENV

      - name: Verify App Health
        run: |
          echo "Menunggu app benar-benar ready..."
          for i in $(seq 1 30); do
            # Cek apakah app merespons dengan HTTP 200
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${{ env.PORT }}/" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "App ready (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App tidak merespons HTTP 200"
          echo "Log app terakhir:"
          tail -n 100 /tmp/app.log
          exit 1

      - name: Register Node to Bridge
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_ADMIN_KEY: ${{ secrets.BRIDGE_ADMIN_KEY }}
          NODE_CATEGORY: ${{ inputs.category }}
          TARGET_URL: ${{ env.URL }}
        run: |
          [ -z "$BRIDGE_URL" ] || [ -z "$BRIDGE_ADMIN_KEY" ] && exit 0
          
          NODE_ID="gha_$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 6)"
          NODE_KEY=$(head /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10)
          CLEAN_URL=$(echo "$TARGET_URL" | tr -d '\r\n\t ' | sed 's/\/$//')
          
          # Buat JSON 100% valid menggunakan jq (anti-escape error)
          PAYLOAD=$(jq -n \
            --arg action "add" \
            --arg category "$NODE_CATEGORY" \
            --arg id "$NODE_ID" \
            --arg url "$CLEAN_URL" \
            --arg key "$NODE_KEY" \
            '{action: $action, category: $category, id: $id, url: $url, key: $key}')
          
          RESPONSE=$(curl -s -X POST "$BRIDGE_URL/v4/node" \
            -H "Content-Type: application/json" \
            -H "key: $BRIDGE_ADMIN_KEY" \
            -d "$PAYLOAD")
            
          if echo "$RESPONSE" | grep -qE '"status"[[:space:]]*:[[:space:]]*"success"'; then
            echo "::notice::Node $NODE_ID registered successfully."
          else
            echo "::error::Registrasi gagal. Respon: $RESPONSE"
            echo "Payload yang dikirim: $PAYLOAD"
            exit 1
          fi
          
          echo "NODE_ID=$NODE_ID" >> $GITHUB_ENV
          echo "NODE_KEY=$NODE_KEY" >> $GITHUB_ENV

      - name: Keep alive
        run: |
          while true; do
            sleep 60
            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "::error::Cloudflared tunnel mati"
              exit 1
            fi
          done